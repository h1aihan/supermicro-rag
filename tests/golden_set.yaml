# Golden set for deterministic retrieval and answer quality evaluation.
#
# Each entry defines ground truth for one query:
#   must_retrieve:      substring patterns that MUST appear in at least one source filename (top-K)
#   must_not_retrieve:  substring patterns that must NOT appear in any source filename
#   min_sources:        minimum number of unique sources expected
#   facts:              factual claims the final LLM answer must contain (for LLM-as-judge)
#   rubric:             grading rubric for the LLM judge
#   scope:              search scope override ("primary", "manual", "both") -- defaults to "primary"
#   conversation:       optional prior conversation context (for follow-up queries)

# ─── Detail: specific product queries ─────────────────────────────────────

- id: detail_521ge
  query: "What are the specs of SYS-521GE-TNRT?"
  category: detail
  must_retrieve:
    - "sys-521ge-tnrt"
    - "521ge"
  must_not_retrieve:
    - "sys-421ge"
  min_sources: 3
  facts:
    - "5U form factor"
    - "dual Intel Xeon"
    - "supports H100 GPUs"
  rubric: "Must describe the SYS-521GE-TNRT with accurate specs from the datasheet"

- id: detail_821ge
  query: "Tell me about the SYS-821GE-TNHR"
  category: detail
  must_retrieve:
    - "821ge"
  min_sources: 3
  facts:
    - "8U form factor"
    - "HGX"
    - "NVLink"
  rubric: "Must describe the 8U GPU server with H100/H200 HGX specs"

- id: detail_partial_521ge
  query: "Tell me about the 521GE"
  category: detail
  must_retrieve:
    - "521ge"
  min_sources: 2
  facts:
    - "5U"
    - "GPU"
  rubric: "Should resolve partial product code to SYS-521GE-TNRT and describe it"

- id: detail_gpu_count_521ge
  query: "How many GPUs does the SYS-521GE-TNRT support?"
  category: detail
  must_retrieve:
    - "521ge"
  min_sources: 2
  facts:
    - "GPU"
  rubric: "Must state the number of GPUs supported by SYS-521GE-TNRT"

- id: detail_8u_power
  query: "What is the power consumption of the 8U GPU server?"
  category: detail
  must_retrieve:
    - "821ge"
  min_sources: 2
  facts:
    - "power"
  rubric: "Must reference power specs for the 8U GPU server (SYS-821GE)"

