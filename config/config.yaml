# Configuration for Supermicro RAG System

# PDF Processing
pdf_input_dir: "pdfs/"
raw_text_output_dir: "data/raw_text/"

# Text Chunking
chunk_size: 1000
chunk_overlap: 200

# Embeddings
embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
embedding_output_dir: "embeddings/"

# Vector Store
vector_store_type: "faiss"
faiss_index_dir: "embeddings/faiss_index/"

# Retrieval
top_k: 5

# LLM Configuration
llm_provider: "openai"  # Options: openai, ollama
llm_model: "gpt-3.5-turbo"
ollama_model: "llama3"  # If using Ollama
ollama_base_url: "http://localhost:11434"

# Chunking output
chunks_output_file: "data/chunks.jsonl"
