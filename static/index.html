<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Supermicro RAG Assistant</title>
    <style>
      :root {
        /* Supermicro-inspired palette (heavier/darker UI) */
        --sm-green: #009639;
        --sm-red: #D22630;
        --sm-blue: #003A70;

        --bg: #06130d;
        --panel: #0b1c14;
        --muted: rgba(234, 240, 255, 0.72);
        --text: #eaf0ff;
        --accent: var(--sm-green);
        --user: rgba(0, 150, 57, 0.12);
        --bot: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.14);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
        background:
          radial-gradient(1100px 700px at 12% 0%, rgba(0,150,57,0.22), transparent 55%),
          radial-gradient(900px 650px at 88% 0%, rgba(210,38,48,0.18), transparent 58%),
          var(--bg);
        color: var(--text);
      }
      .wrap {
        max-width: 980px;
        margin: 0 auto;
        padding: 24px 16px 28px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
      }
      .mark {
        width: 30px;
        height: 30px;
        border-radius: 999px;
        border: 3px solid var(--sm-green);
        position: relative;
        box-shadow:
          0 0 0 6px rgba(0,150,57,0.10),
          0 16px 40px rgba(0,0,0,0.35);
      }
      .mark::after {
        content: "";
        position: absolute;
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--sm-red);
        right: -2px;
        top: 3px;
        box-shadow: 0 0 0 4px rgba(210,38,48,0.14);
      }
      .title {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      h1 {
        font-size: 18px;
        margin: 0;
        letter-spacing: 0.2px;
      }
      .sub {
        font-size: 12px;
        color: var(--muted);
      }
      .pill {
        font-size: 12px;
        color: var(--muted);
        padding: 6px 10px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(11, 28, 20, 0.75);
        backdrop-filter: blur(8px);
      }
      .panel {
        border: 1px solid var(--border);
        background: rgba(11, 28, 20, 0.80);
        border-radius: 14px;
        overflow: hidden;
        box-shadow: 0 22px 55px rgba(0, 0, 0, 0.40);
        backdrop-filter: blur(10px);
      }
      .messages {
        height: min(68vh, 640px);
        overflow: auto;
        padding: 14px;
      }
      .msg {
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 10px 0;
        line-height: 1.35;
        white-space: pre-wrap;
        word-wrap: break-word;
      }
      .msg.user { background: var(--user); border-color: rgba(0,150,57,0.35); }
      .msg.bot { background: var(--bot); }
      .msg.loading { opacity: 0.9; }
      .dots::after {
        content: "";
        display: inline-block;
        width: 18px;
        text-align: left;
        animation: dots 1.2s steps(4, end) infinite;
      }
      @keyframes dots {
        0% { content: ""; }
        25% { content: "."; }
        50% { content: ".."; }
        75% { content: "..."; }
        100% { content: ""; }
      }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      .sources {
        margin-top: 10px;
        padding-top: 10px;
        border-top: 1px solid var(--border);
        color: var(--muted);
        font-size: 12px;
      }
      .sources ul { margin: 6px 0 0; padding-left: 18px; }
      .composer {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        padding: 12px;
        border-top: 1px solid var(--border);
        background: rgba(11, 28, 20, 0.86);
      }
      textarea {
        width: 100%;
        resize: none;
        min-height: 44px;
        max-height: 140px;
        padding: 10px 12px;
        border-radius: 12px;
        border: 1px solid var(--border);
        background: rgba(6, 19, 13, 0.65);
        color: var(--text);
        outline: none;
        font-size: 16px; /* Prevents iOS Safari zoom on focus (needs >= 16px) */
      }
      textarea:focus {
        border-color: rgba(0,150,57,0.70);
        box-shadow: 0 0 0 4px rgba(0,150,57,0.18);
      }
      textarea:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }
      button {
        padding: 10px 14px;
        border-radius: 12px;
        border: 1px solid rgba(0,150,57,0.70);
        background: linear-gradient(180deg, rgba(0,150,57,0.26), rgba(0,150,57,0.12));
        color: var(--text);
        cursor: pointer;
        min-width: 92px;
      }
      button:hover {
        border-color: rgba(0,150,57,0.85);
        box-shadow: 0 12px 26px rgba(0,150,57,0.18);
      }
      button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      a { color: #7db5ff; }
      code { color: rgba(234, 240, 255, 0.92); }
      /* Markdown rendered content styles - override pre-wrap from .msg */
      .msg .md-body { white-space: normal !important; }
      .msg .md-body p { margin: 0.4em 0; }
      .msg .md-body h2 { margin: 0.8em 0 0.3em; font-size: 1.1em; color: var(--text); font-weight: 600; }
      .msg .md-body h3 { margin: 0.8em 0 0.3em; font-size: 1em; color: var(--text); font-weight: 600; }
      .msg .md-body ul, .msg .md-body ol { margin: 0.3em 0; padding-left: 1.4em; }
      .msg .md-body li { margin: 0.15em 0; }
      .msg .md-body table { border-collapse: collapse; margin: 0.5em 0; width: 100%; font-size: 0.92em; }
      .msg .md-body th, .msg .md-body td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
      .msg .md-body th { background: rgba(0,150,57,0.12); }
      .msg .md-body strong { color: #fff; }
      .msg .md-body code { background: rgba(255,255,255,0.08); padding: 1px 4px; border-radius: 3px; font-size: 0.9em; }
      .msg .md-body pre { background: rgba(255,255,255,0.05); padding: 8px 12px; border-radius: 6px; overflow-x: auto; }
      .msg .md-body hr { border: none; border-top: 1px solid var(--border); margin: 0.6em 0; }
      .new-chat {
        padding: 6px 12px;
        font-size: 12px;
        min-width: auto;
        background: transparent;
        border-color: var(--border);
      }
      .new-chat:hover {
        border-color: rgba(210,38,48,0.6);
        background: rgba(210,38,48,0.1);
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <div class="brand">
          <div class="mark" aria-hidden="true"></div>
          <div class="title">
            <h1>Supermicro RAG Assistant</h1>
            <div class="sub">AI-powered product documentation search</div>
          </div>
        </div>
        <div class="pill" id="health">Checking…</div>
        <button class="new-chat" id="newChat">New Chat</button>
      </header>

      <div class="panel">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <textarea id="input" placeholder="Ask a question about Supermicro products/docs… (Shift+Enter for newline)"></textarea>
          <button id="send">Send</button>
        </div>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
    <script>
      const $ = (id) => document.getElementById(id);

      // Configure marked for safe rendering
      marked.setOptions({ breaks: true, gfm: true });

      function renderMarkdown(text) {
        try {
          return marked.parse(text || "");
        } catch (e) {
          // Fallback to plain text if markdown parsing fails
          const div = document.createElement("div");
          div.textContent = text;
          return div.innerHTML;
        }
      }
      const messagesEl = $("messages");
      const inputEl = $("input");
      const sendBtn = $("send");
      const healthEl = $("health");
      
      // Conversation history for context (sent to server for follow-up questions)
      let conversationHistory = [];

      function setPill(text) {
        healthEl.textContent = text;
      }

      function addMessage(role, text, sources = null, { loading = false } = {}) {
        const box = document.createElement("div");
        box.className = "msg " + role + (loading ? " loading" : "");
        const meta = document.createElement("div");
        meta.className = "meta";
        meta.innerHTML = `<span>${role === "user" ? "You" : "Assistant"}</span><span>${new Date().toLocaleTimeString()}</span>`;
        const body = document.createElement("div");
        if (loading) {
          const span = document.createElement("span");
          span.textContent = text || "Thinking";
          const dots = document.createElement("span");
          dots.className = "dots";
          body.appendChild(span);
          body.appendChild(dots);
        } else if (role === "bot" && text) {
          body.className = "md-body";
          body.innerHTML = renderMarkdown(text);
        } else {
          body.textContent = text || "";
        }
        box.appendChild(meta);
        box.appendChild(body);

        if (sources && sources.length) {
          const s = document.createElement("div");
          s.className = "sources";
          const ul = document.createElement("ul");
          for (const src of sources) {
            const li = document.createElement("li");
            li.textContent = src;
            ul.appendChild(li);
          }
          s.appendChild(document.createTextNode("Sources:"));
          s.appendChild(ul);
          box.appendChild(s);
        }

        messagesEl.appendChild(box);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return { box, body };
      }

      async function checkHealth() {
        try {
          const r = await fetch("/health");
          const j = await r.json();
          setPill(j.ok ? "Healthy" : "Unhealthy");
        } catch (e) {
          setPill("Offline");
        }
      }

      async function send() {
        const msg = inputEl.value.trim();
        if (!msg) return;
        inputEl.value = "";
        addMessage("user", msg);
        
        // Capture history BEFORE adding current message (last 6 turns for context)
        const historyToSend = conversationHistory.slice(-6);
        
        // Add user message to history for future turns
        conversationHistory.push({ role: "user", content: msg });

        sendBtn.disabled = true;
        sendBtn.textContent = "…";
        inputEl.disabled = true;
        const prevPill = healthEl.textContent;
        setPill("Thinking…");
        const pending = addMessage("bot", "Thinking", null, { loading: true });
        try {
          const r = await fetch("/api/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ 
              message: msg,
              history: historyToSend  // Send PREVIOUS messages only
            }),
          });
          const j = await r.json();
          // Replace the pending loading bubble with markdown-rendered content
          pending.box.classList.remove("loading");
          pending.body.classList.remove("dots");
          pending.body.className = "md-body";
          pending.body.innerHTML = renderMarkdown(j.answer || "(no answer)");
          
          // Add assistant response to history
          conversationHistory.push({ role: "assistant", content: j.answer || "" });

          const sources = j.sources || [];
          if (sources.length) {
            const s = document.createElement("div");
            s.className = "sources";
            const ul = document.createElement("ul");
            for (const src of sources) {
              const li = document.createElement("li");
              li.textContent = src;
              ul.appendChild(li);
            }
            s.appendChild(document.createTextNode("Sources:"));
            s.appendChild(ul);
            pending.box.appendChild(s);
          }
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } catch (e) {
          pending.box.classList.remove("loading");
          pending.body.textContent = "Request failed: " + (e?.message || String(e));
        } finally {
          sendBtn.disabled = false;
          sendBtn.textContent = "Send";
          inputEl.disabled = false;
          inputEl.focus();
          setPill(prevPill || "Healthy");
        }
      }

      sendBtn.addEventListener("click", send);
      inputEl.addEventListener("keydown", (e) => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      });
      
      $("newChat").addEventListener("click", () => {
        conversationHistory = [];
        messagesEl.innerHTML = "";
        addMessage("bot", "Welcome! I can help you find information about Supermicro servers, storage systems, motherboards, and other products. Ask me about specifications, features, or compatibility.");
        inputEl.focus();
      });

      checkHealth();
      addMessage("bot", "Welcome! I can help you find information about Supermicro servers, storage systems, motherboards, and other products. Ask me about specifications, features, or compatibility.");
      inputEl.focus();
    </script>
  </body>
</html>
